# Demo site used by the tests, the dashboard and the README figures.
# Distances are walking distances in metres. Positions are plan coordinates
# used only for drawing. Replace this file with a survey of your own building.
site:
  name: Harbour Works Distribution Centre (demo site)
  assembly_points:
    AP_FRONT: {name: Front Car Park Assembly Point}
    AP_REAR: {name: Rear Yard Assembly Point}

zones:
  # ground floor
  - {id: G_RECEPTION, name: Reception, type: office, floor: 0, position: [10, 12], occupancy: 3,
     exit: {name: Main Entrance, assembly_point: AP_FRONT}}
  - {id: G_CORRIDOR, name: Ground Floor Corridor, type: corridor, floor: 0, position: [34, 12]}
  - {id: G_KITCHEN, name: Staff Kitchen, type: kitchen, floor: 0, position: [34, 32], occupancy: 4,
     risk_multiplier: 1.1, materials: [cooking_oil]}
  - {id: G_STAIR_A, name: Stair A, type: stair, floor: 0, position: [16, 32]}
  - {id: G_WAREHOUSE, name: Main Warehouse, type: warehouse, floor: 0, position: [62, 24], occupancy: 12,
     risk_multiplier: 1.2, materials: [cardboard, pallets]}
  - {id: G_CHARGING, name: Battery Charging Bay, type: charging_bay, floor: 0, position: [90, 42], occupancy: 1,
     risk_multiplier: 1.35, materials: [lithium_batteries]}
  - {id: G_LOADING, name: Loading Bay, type: loading_bay, floor: 0, position: [90, 12], occupancy: 5,
     exit: {name: Loading Dock Door, assembly_point: AP_REAR}}
  - {id: G_PLANT, name: Plant Room, type: plant_room, floor: 0, position: [64, 50],
     risk_multiplier: 1.15, materials: [electrical_equipment]}
  - {id: G_STAIR_B, name: Stair B, type: stair, floor: 0, position: [44, 50],
     exit: {name: Rear Fire Exit, assembly_point: AP_REAR}}
  # first floor
  - {id: F_OFFICE, name: Open Plan Office, type: office, floor: 1, position: [30, 14], occupancy: 18, assisted: true}
  - {id: F_CORRIDOR, name: First Floor Corridor, type: corridor, floor: 1, position: [52, 30]}
  - {id: F_SERVER, name: Server Room, type: server_room, floor: 1, position: [78, 14], occupancy: 1,
     risk_multiplier: 1.3, materials: [electrical_equipment]}
  - {id: F_MEETING, name: Meeting Suite, type: office, floor: 1, position: [78, 44], occupancy: 6}
  - {id: F_STAIR_A, name: Stair A Landing, type: stair, floor: 1, position: [16, 32], refuge: true}
  - {id: F_STAIR_B, name: Stair B Landing, type: stair, floor: 1, position: [44, 50], refuge: true}

edges:
  - [G_RECEPTION, G_CORRIDOR, 14, door]
  - [G_CORRIDOR, G_KITCHEN, 9, door]
  - [G_CORRIDOR, G_STAIR_A, 10, door]
  - [G_CORRIDOR, G_WAREHOUSE, 18, door]
  - [G_WAREHOUSE, G_LOADING, 22, open]
  - [G_WAREHOUSE, G_CHARGING, 20, open]
  - [G_CHARGING, G_LOADING, 15, open]
  - [G_WAREHOUSE, G_PLANT, 16, door]
  - [G_WAREHOUSE, G_STAIR_B, 17, door]
  - [G_PLANT, G_STAIR_B, 8, door]
  - [G_STAIR_A, F_STAIR_A, 12, stair]
  - [G_STAIR_B, F_STAIR_B, 12, stair]
  - [F_STAIR_A, F_OFFICE, 10, door]
  - [F_OFFICE, F_CORRIDOR, 14, door]
  - [F_CORRIDOR, F_SERVER, 12, door]
  - [F_CORRIDOR, F_MEETING, 11, door]
  - [F_CORRIDOR, F_STAIR_B, 13, door]
  - [G_RECEPTION, F_OFFICE, 8, lift]

cameras:
  cam_warehouse_01: {zone: G_WAREHOUSE, thermal: false}
  cam_kitchen_01: {zone: G_KITCHEN, thermal: false}
  cam_charging_01: {zone: G_CHARGING, thermal: true}
  cam_plant_01: {zone: G_PLANT, thermal: true}
  cam_server_01: {zone: F_SERVER, thermal: true}
  cam_office_01: {zone: F_OFFICE, thermal: false}
  cam_corridor_01: {zone: G_CORRIDOR, thermal: false}
