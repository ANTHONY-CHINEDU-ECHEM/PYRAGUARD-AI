[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyraguard"
version = "1.0.0"
description = "PyraGuard AI: autonomous early stage thermal hazard identification and evacuation intelligence via multimodal RAG and vision AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["fire detection", "computer vision", "rag", "multimodal", "safety", "yolo"]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.4"]
embeddings = ["sentence-transformers>=3.0", "open_clip_torch>=2.24", "pillow>=10.0"]
llm = ["anthropic>=0.40", "openai>=1.40"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dashboard = ["streamlit>=1.50"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]
all = ["pyraguard[vision,embeddings,llm,api,dashboard,dev]"]

[project.scripts]
pyraguard = "pyraguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]
